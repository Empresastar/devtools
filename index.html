<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA QUÂNTICO - DEEP SCANNER</title>
    <style>
        :root { --bg: #0d1117; --sidebar: #161b22; --accent: #58a6ff; --text: #c9d1d9; }
        body { background: var(--bg); color: var(--text); font-family: 'Fira Code', monospace; margin: 0; overflow: hidden; }
        #app { display: flex; height: 100vh; }
        #side { width: 300px; background: var(--sidebar); border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        #editor-cont { flex: 1; display: flex; flex-direction: column; }
        #monaco-editor { flex: 1; }
        #preview { width: 400px; background: white; border-left: 1px solid #30363d; }
        .input-box { padding: 15px; background: #010409; display: flex; gap: 5px; }
        input { background: #0d1117; border: 1px solid #30363d; color: var(--accent); padding: 10px; flex: 1; font-size: 12px; outline: none; }
        button { background: #238636; color: white; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background: #2ea043; }
        .tree { overflow-y: auto; flex: 1; padding: 10px; }
        .item { padding: 6px 10px; cursor: pointer; font-size: 12px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item:hover { background: #21262d; }
        .item.active { background: #1f6feb; color: white; }
        .folder { font-weight: bold; color: #8b949e; font-size: 10px; text-transform: uppercase; margin: 15px 0 5px 5px; border-bottom: 1px solid #30363d; }
    </style>
</head>
<body>

<div id="app">
    <aside id="side">
        <div class="input-box">
            <input type="text" id="target-url" placeholder="https://alvo.com">
            <button id="scan-btn">SCAN</button>
        </div>
        <div class="tree" id="tree">
            <div style="color: #444; padding: 20px; text-align: center;">Aguardando sinal quântico...</div>
        </div>
    </aside>

    <main id="editor-cont">
        <div id="tab-name" style="padding: 10px; background: #161b22; font-size: 11px; color: #58a6ff;">SISTEMA PRONTO</div>
        <div id="monaco-editor"></div>
    </main>

    <section id="preview">
        <iframe id="view" style="width:100%; height:100%; border:none;"></iframe>
    </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>

<script>
    let editor, vfs = {};
    const proxy = "https://api.allorigins.win/get?url=";

    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('monaco-editor'), {
            value: "// SISTEMA BRUTO ATIVADO\n// COLE A URL E DISPARE O SCAN",
            language: 'html', theme: 'vs-dark', automaticLayout: true, fontSize: 13
        });
    });

    async function deepFetch(url) {
        try {
            const res = await fetch(proxy + encodeURIComponent(url));
            const data = await res.json();
            return data.contents;
        } catch (e) { return null; }
    }

    document.getElementById('scan-btn').onclick = async () => {
        const url = document.getElementById('target-url').value;
        if(!url) return alert("Cadê a URL?");
        
        document.getElementById('scan-btn').innerText = "VARRENDO...";
        const html = await deepFetch(url);
        
        if(!html) { alert("Bloqueio detectado ou URL inválida"); return; }

        vfs = { '10. index.html': { c: html, l: 'html' }, css: {}, js: {}, img: {} };
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // EXTRAÇÃO BRUTA (PRODUZINDO A ÁRVORE 11, 12, 13)
        doc.querySelectorAll('link[rel="stylesheet"]').forEach((el, i) => {
            vfs.css[`11. estilo_${i+1}.css`] = { c: `/* Source: ${el.href} */\n/* Extraindo dados... */`, l: 'css' };
        });

        doc.querySelectorAll('script[src]').forEach((el, i) => {
            vfs.js[`12. script_${i+1}.js`] = { c: `// Source: ${el.src}\n// Mapeando funções...`, l: 'javascript' };
        });

        doc.querySelectorAll('img[src]').forEach((el, i) => {
            vfs.img[`13. imagem_${i+1}.png`] = { c: el.src, l: 'text' };
        });

        renderTree();
        document.getElementById('scan-btn').innerText = "SCAN";
    };

    function renderTree() {
        const container = document.getElementById('tree');
        container.innerHTML = "";

        // Render Raiz
        createItem('10. index.html', '10. index.html', 'html', 'root');

        // Render CSS
        if(Object.keys(vfs.css).length) {
            container.innerHTML += `<div class="folder">11. Stylesheets</div>`;
            Object.keys(vfs.css).forEach(k => createItem(k, k, 'css', 'css'));
        }

        // Render JS
        if(Object.keys(vfs.js).length) {
            container.innerHTML += `<div class="folder">12. JavaScript</div>`;
            Object.keys(vfs.js).forEach(k => createItem(k, k, 'javascript', 'js'));
        }
    }

    function createItem(label, key, lang, type) {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerText = label;
        div.onclick = () => {
            document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
            div.classList.add('active');
            let content = (type === 'root') ? vfs['10. index.html'].c : vfs[type][key].c;
            
            editor.setValue(content);
            monaco.editor.setModelLanguage(editor.getModel(), lang);
            document.getElementById('tab-name').innerText = key;
            if(lang === 'html') document.getElementById('view').srcdoc = content;
        };
        document.getElementById('tree').appendChild(div);
    }
</script>
</body>
</html>
