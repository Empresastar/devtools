<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA QUÂNTICO V2 - BRUTO</title>
    <style>
        :root { --bg: #0d1117; --sidebar: #161b22; --accent: #58a6ff; --text: #c9d1d9; }
        body { background: var(--bg); color: var(--text); font-family: 'Fira Code', monospace; margin: 0; overflow: hidden; }
        #app { display: flex; height: 100vh; }
        #side { width: 320px; background: var(--sidebar); border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        #editor-cont { flex: 1; display: flex; flex-direction: column; }
        #monaco-editor { flex: 1; }
        #preview { width: 400px; background: white; border-left: 1px solid #30363d; }
        .input-box { padding: 15px; background: #010409; display: flex; flex-direction: column; gap: 8px; }
        input { background: #0d1117; border: 1px solid #30363d; color: var(--accent); padding: 10px; font-size: 12px; outline: none; border-radius: 4px; }
        button { background: #238636; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        button:hover { background: #2ea043; transform: scale(1.02); }
        .tree { overflow-y: auto; flex: 1; padding: 10px; }
        .item { padding: 6px 10px; cursor: pointer; font-size: 12px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #8b949e; }
        .item:hover { background: #21262d; color: white; }
        .item.active { background: #1f6feb; color: white; font-weight: bold; }
        .folder { font-weight: bold; color: #58a6ff; font-size: 10px; text-transform: uppercase; margin: 15px 0 5px 5px; letter-spacing: 1px; }
        #status { font-size: 10px; color: #f85149; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

<div id="app">
    <aside id="side">
        <div class="input-box">
            <input type="text" id="target-url" placeholder="https://site-alvo.com">
            <button id="scan-btn">DISPARAR VARREDURA QUÂNTICA</button>
            <div id="status"></div>
        </div>
        <div class="tree" id="tree"></div>
    </aside>

    <main id="editor-cont">
        <div id="tab-name" style="padding: 10px; background: #161b22; font-size: 11px; color: #58a6ff; border-bottom: 1px solid #30363d;">CONSOLE ATIVO</div>
        <div id="monaco-editor"></div>
    </main>

    <section id="preview">
        <iframe id="view" style="width:100%; height:100%; border:none;"></iframe>
    </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.min.js"></script>

<script>
    let editor, vfs = {};
    const statusEl = document.getElementById('status');
    
    // Proxies de contingência para evitar o erro de CORS
    const proxies = [
        url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
        url => `https://cors-anywhere.herokuapp.com/${url}`,
        url => `https://thingproxy.freeboard.io/fetch/${url}`
    ];

    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('monaco-editor'), {
            value: "// AGUARDANDO COMANDO BRUTO...",
            language: 'javascript', theme: 'vs-dark', automaticLayout: true, fontSize: 13
        });
    });

    async function bruteFetch(url) {
        statusEl.innerText = "Testando tuneis quânticos...";
        for (let getProxy of proxies) {
            try {
                const res = await fetch(getProxy(url));
                if (res.ok) {
                    const data = await res.json();
                    return data.contents || data; // Dependendo do proxy o formato muda
                }
            } catch (e) { continue; }
        }
        return null;
    }

    document.getElementById('scan-btn').onclick = async () => {
        const url = document.getElementById('target-url').value;
        if(!url) return;
        
        document.getElementById('scan-btn').innerText = "VARRENDO...";
        statusEl.innerText = "";
        
        let rawHtml = await bruteFetch(url);
        
        if(!rawHtml || typeof rawHtml !== 'string') {
            statusEl.innerText = "ERRO: Site bloqueou todos os túneis (CORS).";
            document.getElementById('scan-btn').innerText = "SCAN";
            return;
        }

        // Organiza o HTML bruto de forma rápida
        const cleanHtml = html_beautify(rawHtml, { indent_size: 2 });

        vfs = { '10. index.html': { c: cleanHtml, l: 'html' }, css: {}, js: {} };
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHtml, 'text/html');

        // Mapeamento Quântico de Recursos
        doc.querySelectorAll('link[rel="stylesheet"]').forEach((el, i) => {
            const name = `11. style_${i+1}.css`;
            vfs.css[name] = { c: `/* Link Original: ${el.href} */\n/* Puxando dados... */`, l: 'css' };
        });

        doc.querySelectorAll('script[src]').forEach((el, i) => {
            const name = `12. script_${i+1}.js`;
            vfs.js[name] = { c: `// Source: ${el.src}\n// Analisando lógica...`, l: 'javascript' };
        });

        renderTree();
        editor.setValue(cleanHtml);
        monaco.editor.setModelLanguage(editor.getModel(), 'html');
        document.getElementById('view').srcdoc = rawHtml;
        document.getElementById('scan-btn').innerText = "DISPARAR SCAN";
    };

    function renderTree() {
        const tree = document.getElementById('tree');
        tree.innerHTML = `<div class="folder">10. ROOT</div>`;
        createItem('index.html', '10. index.html', 'html', 'root');

        if(Object.keys(vfs.css).length) {
            tree.innerHTML += `<div class="folder">11. CSS FILTERS</div>`;
            Object.keys(vfs.css).forEach(k => createItem(k, k, 'css', 'css'));
        }
        if(Object.keys(vfs.js).length) {
            tree.innerHTML += `<div class="folder">12. JS LOGIC</div>`;
            Object.keys(vfs.js).forEach(k => createItem(k, k, 'javascript', 'js'));
        }
    }

    function createItem(label, key, lang, type) {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerText = label;
        div.onclick = () => {
            document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
            div.classList.add('active');
            let code = (type === 'root') ? vfs['10. index.html'].c : vfs[type][key].c;
            
            // Embelezar código na hora de mostrar
            if(lang === 'css') code = css_beautify(code);
            if(lang === 'javascript') code = js_beautify(code);

            editor.setValue(code);
            monaco.editor.setModelLanguage(editor.getModel(), lang);
            document.getElementById('tab-name').innerText = key;
        };
        document.getElementById('tree').appendChild(div);
    }
</script>
</body>
</html>
