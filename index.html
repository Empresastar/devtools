<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Rubi Code | Editor Profissional</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs/loader.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; background: #1e1e1e; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        #vs-code { display: flex; height: 100vh; }

        /* Barra de Ícones Lateral */
        #activity-bar { width: 50px; background: #333; display: flex; flex-direction: column; align-items: center; padding-top: 15px; gap: 20px; border-right: 1px solid #222; }
        .icon { font-size: 22px; cursor: pointer; opacity: 0.5; }
        .icon:hover { opacity: 1; }
        .icon.active { opacity: 1; border-left: 2px solid #e0115f; width: 100%; text-align: center; }

        /* Sidebar (Explorador) */
        #sidebar { width: 260px; background: #252526; display: flex; flex-direction: column; border-right: 1px solid #333; }
        .sidebar-header { padding: 10px; font-size: 11px; font-weight: bold; color: #888; display: flex; justify-content: space-between; align-items: center; }
        
        .actions { padding: 5px 10px; display: flex; gap: 10px; background: #2d2d2d; }
        .action-btn { cursor: pointer; font-size: 14px; title: "Novo Arquivo"; }
        .action-btn:hover { color: #e0115f; }

        .p2p-box { background: #333; margin: 10px; padding: 10px; border-radius: 4px; font-size: 11px; }
        #meu-id { color: #00ffcc; font-family: monospace; margin: 5px 0; word-break: break-all; }

        /* Lista de Arquivos */
        #file-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; overflow-y: auto; }
        #file-list li { padding: 5px 20px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        #file-list li:hover { background: #2a2d2e; }
        #file-list li.active { background: #37373d; }

        /* Editor */
        #main-editor { flex-grow: 1; display: flex; flex-direction: column; }
        #tabs { height: 35px; background: #252526; display: flex; border-bottom: 1px solid #1e1e1e; }
        .tab { padding: 8px 20px; background: #2d2d2d; font-size: 12px; border-right: 1px solid #1e1e1e; display: flex; align-items: center; gap: 10px; }
        .tab.active { background: #1e1e1e; border-top: 1px solid #e0115f; }

        #monaco-container { flex-grow: 1; width: 100%; }

        /* Status Bar */
        #statusbar { height: 22px; background: #007acc; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; font-size: 12px; }
    </style>
</head>
<body>

<div id="vs-code">
    <aside id="activity-bar">
        <div class="icon active">📄</div>
        <div class="icon">🔍</div>
        <div class="icon">⚙️</div>
    </aside>

    <aside id="sidebar">
        <div class="sidebar-header">
            <span>EXPLORADOR</span>
            <div class="actions">
                <span class="action-btn" id="new-file" title="Novo Arquivo">📄+</span>
                <span class="action-btn" id="open-folder" title="Abrir Pasta">📁</span>
            </div>
        </div>

        <div class="p2p-box">
            <strong>MEU ID P2P:</strong>
            <div id="meu-id">Gerando...</div>
            <input type="text" id="id-amigo" placeholder="ID do Amigo" style="width:100%; background:#444; color:#fff; border:none; padding:4px; margin-top:5px;">
            <button id="btn-conectar" style="width:100%; margin-top:5px; cursor:pointer;">Conectar</button>
        </div>

        <ul id="file-list">
            </ul>
    </aside>

    <main id="main-editor">
        <div id="tabs">
            <div class="tab active" id="active-tab-name">sem-nome.js</div>
        </div>
        <div id="monaco-container"></div>
        <div id="statusbar">
            <div id="status-left">Pronto</div>
            <div id="status-right">UTF-8 | JavaScript</div>
        </div>
    </main>
</div>

<script>
    let editor;
    let peer = new Peer();
    let conn;
    let arquivos = {}; // Armazena o conteúdo de cada arquivo criado
    let arquivoAtual = "";

    // 1. INICIALIZAR EDITOR COLORIDO (MONACO)
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.34.1/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('monaco-container'), {
            value: "// Rubi Code Original\n// Use os ícones acima para criar arquivos",
            language: 'javascript',
            theme: 'vs-dark',
            automaticLayout: true,
            fontSize: 14
        });

        // Sincronizar o que você digita
        editor.onDidChangeModelContent(() => {
            if (arquivoAtual && conn && conn.open) {
                arquivos[arquivoAtual] = editor.getValue();
                conn.send({ type: 'EDIT', file: arquivoAtual, content: editor.getValue() });
            }
        });
    });

    // 2. CRIAR NOVO ARQUIVO
    document.getElementById('new-file').onclick = () => {
        let nome = prompt("Nome do arquivo (ex: index.html):");
        if (nome) {
            adicionarArquivoNaLista(nome, "");
            if (conn) conn.send({ type: 'NEW_FILE', name: nome });
        }
    };

    function adicionarArquivoNaLista(nome, conteudo) {
        arquivos[nome] = conteudo;
        const li = document.createElement('li');
        li.innerHTML = `<span>📄</span> ${nome}`;
        li.onclick = () => abrirArquivo(nome);
        document.getElementById('file-list').appendChild(li);
        abrirArquivo(nome);
    }

    function abrirArquivo(nome) {
        arquivoAtual = nome;
        document.getElementById('active-tab-name').innerText = nome;
        
        // Detectar Linguagem para as CORES
        const ext = nome.split('.').pop();
        let lang = 'javascript';
        if (ext === 'html') lang = 'html';
        if (ext === 'css') lang = 'css';
        
        monaco.editor.setModelLanguage(editor.getModel(), lang);
        editor.setValue(arquivos[nome]);
        document.getElementById('status-right').innerText = `UTF-8 | ${lang.toUpperCase()}`;
    }

    // 3. P2P E SINCRONIZAÇÃO
    peer.on('open', id => document.getElementById('meu-id').innerText = id);

    peer.on('connection', c => {
        conn = c;
        document.getElementById('status-left').innerText = "Amigo Conectado";
        setupReceiver();
    });

    document.getElementById('btn-conectar').onclick = () => {
        conn = peer.connect(document.getElementById('id-amigo').value);
        setupReceiver();
    };

    function setupReceiver() {
        conn.on('data', (data) => {
            if (data.type === 'NEW_FILE') {
                adicionarArquivoNaLista(data.name, "");
            }
            if (data.type === 'EDIT') {
                arquivos[data.file] = data.content;
                if (arquivoAtual === data.file) {
                    const pos = editor.getPosition();
                    editor.setValue(data.content);
                    editor.setPosition(pos);
                }
            }
        });
    }

    // 4. ABRIR PASTA DO PC (Bônus)
    document.getElementById('open-folder').onclick = async () => {
        const dir = await window.showDirectoryPicker();
        document.getElementById('file-list').innerHTML = "";
        for await (const entry of dir.values()) {
            if (entry.kind === 'file') {
                const file = await entry.getFile();
                const text = await file.text();
                adicionarArquivoNaLista(entry.name, text);
            }
        }
    };
</script>

</body>
</html>
